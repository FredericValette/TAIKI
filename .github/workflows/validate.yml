name: Validate Repository

on:
  push:
  pull_request:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skill package structure
        run: python scripts/validate_skills.py

      - name: Run test suites
        run: |
          python -m unittest discover -s tests/controller-tests -p "test_*.py"
          python -m unittest discover -s tests/schema-tests -p "test_*.py"
          python -m unittest discover -s tests/skill-tests -p "test_*.py"
          python -m unittest discover -s tests/integration-tests -p "test_*.py"
