name: Validate MetricsDB SQL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute DDL and integration tests
        run: python -m unittest discover -s tests/integration-tests -p "test_*.py"